# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

# increase scrollback limit from default
set-option -g history-limit 50000

# prefix key to ctrl-space
unbind C-b
set-option -g prefix C-space
bind-key C-space send-prefix

# split panes using | and \\
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# vim-style pane switches with ctrl
bind -n C-h select-pane -L
bind -n C-l select-pane -R
bind -n C-k select-pane -U
bind -n C-j select-pane -D

# vi keybindings in copy mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# put bar on top
set-option -g status-position top

# start pane numbering from one
set -g base-index 1

# renumber windows when one is deleted
 set-option -g renumber-windows on

# open new windows in current working directory
bind  c  new-window      -c "#{pane_current_path}"

# Plugins

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# tpm for nice vim pane switch integration
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-cpu'

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# enable mouse activity
set -g mouse on

# clock mode
setw -g clock-mode-colour yellow

# copy mode
setw -g mode-style 'fg=color139 bg=color235'

# panes
set -g pane-border-style 'fg=color133'
set -g pane-active-border-style 'fg=color219'

# statusbar
# set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=color3 bg=black'

set -g status-left ''
set -g status-left-length 10

set -g status-right-style 'fg=color3 bg=color236'

# no clock; add cpu/ram (so I know when to close chrome, slack, or teams)
set -g status-right ' #{cpu_fg_color} CPU #{cpu_icon} #{cpu_percentage} #[fg=color3] | #{ram_fg_color} RAM  #{ram_icon}  #{ram_percentage}'
set -g status-right-length 50

setw -g window-status-current-style 'fg=black bg=color3'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=color3 bg=color235'
setw -g window-status-format ' #I #[fg=white]#W #[fg=yellow]#F '

setw -g window-status-bell-style 'fg=black bg=color3 bold'

# messages
set -g message-style 'fg=black bg=color3 bold'

# codex floating window;
# attach to session started from current dir if exists.
 bind o run-shell '
    current_dir=$(tmux display-message -p -F "#{pane_current_path}")
    session_name=$(printf "codex_%s" "$current_dir" | tr -c "[:alnum:]" "_")
    tmux popup -E -w 90% -h 80% -T "Codex" \
      "TMUX= tmux new-session -A -s \"$session_name\" -c \"$current_dir\" codex"
  '

# initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
